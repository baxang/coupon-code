name: Ruby

on: [push, pull_request]

jobs:
  test:
    # ubuntu-latest only has builds for Ruby 3.3+, so older Rubies run on ubuntu-24.04.
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    env:
      BUNDLE_WITHOUT: lint

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
        include:
          - { ruby-version: '2.6', os: ubuntu-24.04 }
          - { ruby-version: '2.7', os: ubuntu-24.04 }
          - { ruby-version: '3.0', os: ubuntu-24.04 }
          - { ruby-version: '3.1', os: ubuntu-24.04 }
          - { ruby-version: '3.2', os: ubuntu-24.04 }

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - run: bundle exec standardrb
